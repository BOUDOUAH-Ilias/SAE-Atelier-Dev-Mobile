<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minipress-web</title>
  </head>
  <body>
    <script id="categories_template" type="text/x-handlebars-template">
      <ul class="categories-list">
        <h1>Liste Catégories</h1>
        {{#each categories}}
          <li class="category-item" data-id="{{this.categorie.id}}">
            <h2>{{this.categorie.nom}}</h2>
          </li>
        {{/each}}
      </ul>
    </script>

    <script id="list_template" type="text/x-handlebars-template">
      <ul class="article-list">
        {{#each articles}}
          <li class="article-item" data-href="{{this.links.self.href}}">
            <h2 class="article-title">{{this.article.titre}}</h2>
            <p class="article-date">{{this.article.date_creation}}</p>
            <a
              class="author-link"
              data-id="{{this.article.auteur}}"
              href="#"
            >Auteur #{{this.article.auteur}}</a>
          </li>
        {{/each}}
      </ul>
    </script>

    <div id="categories"></div>
    <hr />
    <button id="btn-all-articles">Tous les articles</button>
    <button id="order-button">ascendant</button>
    <input
      type="text"
      id="filter-input"
      placeholder="Filtrer par mot clé dans le titre ou le résumé..."
    />
    <div id="articles"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
