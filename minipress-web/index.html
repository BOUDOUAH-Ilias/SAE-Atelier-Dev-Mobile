<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minipress-web</title>
  </head>
  <body>

    <script id="list_template" type="text/x-handlebars-template">
      <ul class="article-list">
  {{#each articles}}
  <li class="article-item">
    <h2>{{this.article.titre}}</h2>
    <p class="article-date">{{this.article.date_creation}}</p>
    <p class="article-author">Auteur #{{this.article.auteur}}</p>
  </li>
  {{/each}}
</ul>
    </script>

    <div id="categories"></div>
    <div id="articles"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
