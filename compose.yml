networks:
  minipress.net:
    driver: bridge

services:
  sql:
    image: mariadb:11
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    networks:
      - minipress.net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:5
    ports:
      - "67:8080"
    networks:
      - minipress.net
    depends_on:
      - sql

  minipress.appli:
    image: operrin/php:8.5.4
    command: php -S 0.0.0.0:80 -t /var/www/html
    ports:
      - "666:80"
    volumes:
      - ./minipress:/var/www/html
      - ./images:/var/www/html/img
      - ./minipress/src:/var/www/src
    working_dir: /var/www/src
    networks:
      - minipress.net
    depends_on:
      sql:
        condition: service_healthy

  minipress.api:
    image: operrin/php:8.5.4
    command: php -S 0.0.0.0:80 -t /var/www/html
    ports:
      - "69:80"
    volumes:
      - ./minipress:/var/www/html
      - ./minipress/src:/var/www/src
      - ./minipress/src:/var/www/minipress/src
    working_dir: /var/www/src
    networks:
      - minipress.net
    depends_on:
      sql:
        condition: service_healthy

  minipress.web:
    image: node:22-alpine
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./minipress-web:/app
    working_dir: /app
    networks:
      - minipress.net
